[project]
name = "eudr-evidence-agent"
version = "0.1.0"
description = "Agentic AI that checks Karnataka coffee plots against the EU Deforestation Regulation (EUDR) and returns an evidence-backed verdict."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "rank-bm25>=0.2.2",
    "chromadb>=1.0",
    "earthengine-api>=1.0",
    "shapely>=2.0",
    "openai>=1.40",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Shared case storage for a deployment: set DATABASE_URL to use it instead of SQLite.
postgres = ["langgraph-checkpoint-postgres>=3.0", "psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
# Added when the Whisp baseline is built:
geo = ["openforis-whisp", "geopandas"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
